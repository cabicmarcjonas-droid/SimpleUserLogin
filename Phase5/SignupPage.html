<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPSEC Sign Up</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Create account</h1>
      <p class="subtitle">Sign Up to get Started</p>

      <form id="signupForm" novalidate>
        <label for="signupEmail">Email</label>
        <input id="signupEmail" type="email" required autocomplete="email" />

        <label for="signupPassword">Password</label>
        <input id="signupPassword" type="password" required autocomplete="new-password" />

        <label for="signupConfirmPassword">Confirm Password</label>
        <input id="signupConfirmPassword" type="password" required autocomplete="new-password" />

        <div id="signupError" class="error" aria-live="polite"></div>
        <button type="submit">Sign Up</button>
      </form>

      <p class="switch">
        Already have an account? <a href="LoginPage.html">Log in</a>
      </p>
    </div>

    <script src="index.js"></script>
  </body>
</html>
